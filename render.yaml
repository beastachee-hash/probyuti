# Render читает этот файл и создаёт сервис с ПРАВИЛЬНЫМИ настройками.
# Чтобы заполнить поля вручную было невозможно ошибиться.
services:
  - type: web
    name: probyuti
    runtime: node
    plan: free
    # ВАЖНО: rootDir по умолчанию = корень репозитория (там server.js).
    # Здесь мы это фиксируем явно, но НЕ указываем db/.
    rootDir: .
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Пароль админки. Смени значение на свой здесь и закоммить,
      # либо задай его в панели Render (переменная приоритетнее файла).
      - key: ADMIN_PASSWORD
        sync: false
      # Токен Яндекс.Диска (данные + фото). Задаётся в панели Render, не в коде.
      - key: YDISK_TOKEN
        sync: false
